jobms.url=${JOBMS_URL:http://job}
companyms.url=${COMPANYMS_URL:http://company}
reviewms.url=${REVIEWMS_URL:http://review}

spring.application.name=reviewms
server.port=8083

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/review}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

# Service discovery: Eureka is disabled because Kubernetes handles discovery
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Tracing (Zipkin)
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized