spring.application.name=config-server
server.port=${SERVER_PORT:8888}

# Eureka (service name from docker-compose)
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://servicereg:8761/eureka/}

# Config source (public Git repo)
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/divyanshusaroj/application-config}
spring.cloud.config.server.git.default-label=main