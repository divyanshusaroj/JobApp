jobms.url=${JOBMS_URL:http://job:8082}
companyms.url=${COMPANYMS_URL:http://company:8081}
reviewms.url=${REVIEWMS_URL:http://review:8083}

spring.application.name=jobms
server.port=8082

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/job}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://servicereg:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JSON
spring.jackson.mapper.sort-properties-alphabetically=false

# Tracing (Zipkin)
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

# Config server (disabled in this profile)
# spring.config.import=optional:configserver:http://config-server-ms:8080
spring.cloud.config.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true

# Resilience4j: circuit breaker
resilience4j.circuitbreaker.instances.companyBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.companyBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.companyBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.companyBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.companyBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.companyBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.companyBreaker.sliding-window-type=count-based

# Resilience4j: retry
resilience4j.retry.instances.companyBreaker.max-attempts=5
resilience4j.retry.instances.companyBreaker.wait-duration=2s

# Resilience4j: rate limiter (2 calls per 4 seconds)
resilience4j.ratelimiter.instances.companyBreaker.timeout-duration=0s
resilience4j.ratelimiter.instances.companyBreaker.limit-refresh-period=4s
resilience4j.ratelimiter.instances.companyBreaker.limit-for-period=2