spring.application.name=gateway
server.port=8084

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://servicereg:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Tracing (Zipkin)
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

# Gateway routes
spring.cloud.gateway.server.webflux.routes[0].id=companyms
spring.cloud.gateway.server.webflux.routes[0].uri=${COMPANYMS_URL:http://company:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/companies/**

spring.cloud.gateway.server.webflux.routes[1].id=jobms
spring.cloud.gateway.server.webflux.routes[1].uri=${JOBMS_URL:http://job:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/jobs/**

spring.cloud.gateway.server.webflux.routes[2].id=reviewms
spring.cloud.gateway.server.webflux.routes[2].uri=${REVIEWMS_URL:http://review:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/reviews/**

# Eureka dashboard through the gateway (demo only)
spring.cloud.gateway.server.webflux.routes[3].id=eureka-server
spring.cloud.gateway.server.webflux.routes[3].uri=${EUREKA_HOST_URL:http://servicereg:8761}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/eureka/main
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/

spring.cloud.gateway.server.webflux.routes[4].id=eureka-server-static
spring.cloud.gateway.server.webflux.routes[4].uri=${EUREKA_HOST_URL:http://servicereg:8761}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/eureka/**

logging.level.root=info
logging.level.org.springframework.cloud.gateway=INFO